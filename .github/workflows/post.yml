name: 投稿

# 毎日 日本時間 8:00 に実行し、その日の予定があれば投稿する
on:
  schedule:
    - cron: '0 23 * * *'   # UTC 23:00 = JST 翌8:00
  workflow_dispatch:        # 手動でも走らせられる
    inputs:
      dry_run:
        description: '1 を入れると公開せず内容だけ確認する'
        required: false
        default: '0'

permissions:
  contents: write           # posted.log の書き戻しに使う

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 投稿する
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: python post.py

      - name: 投稿済みの記録を残す
        if: success()
        run: |
          if [ -n "$(git status --porcelain posted.log)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add posted.log
            git commit -m "posted $(date -u +%Y-%m-%d)"
            git push
          fi
